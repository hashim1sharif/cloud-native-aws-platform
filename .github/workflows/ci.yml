name: Continuous Integration

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: find src -type f -name '*.js' -exec node --check {} \;

      - name: Build Docker image
        run: docker build -t task-management-backend:ci .

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build Docker image
        run: docker build -t task-management-frontend:ci .

  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.3"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialize bootstrap
        run: terraform -chdir=infra/terraform/bootstrap init -backend=false

      - name: Validate bootstrap
        run: terraform -chdir=infra/terraform/bootstrap validate

      - name: Initialize dev environment
        run: terraform -chdir=infra/terraform/environments/dev init -backend=false

      - name: Validate dev environment
        run: terraform -chdir=infra/terraform/environments/dev validate
