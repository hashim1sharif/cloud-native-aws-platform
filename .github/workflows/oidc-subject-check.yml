name: OIDC subject check

on:
  push:
    branches:
      - feature/github-actions-deploy

permissions:
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Print OIDC claims
        shell: bash
        run: |
          response="$(curl -sSfL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          token="$(python3 -c \
            'import json, sys; print(json.load(sys.stdin)["value"])' \
            <<< "${response}")"

          TOKEN="${token}" python3 - <<'PY'
          import base64
          import json
          import os

          payload = os.environ["TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          for key in (
              "sub",
              "aud",
              "repository",
              "repository_id",
              "repository_owner_id",
          ):
              print(f"{key}: {claims.get(key)}")
          PY
