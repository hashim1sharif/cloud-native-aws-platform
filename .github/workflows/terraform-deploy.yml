name: Terraform Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::731629701372:role/task-management-terraform-role

  TERRAFORM_VERSION: 1.13.3
  TF_IN_AUTOMATION: true
  TF_INPUT: false

  TF_STATE_BUCKET: task-management-platform-state-lock-eu-west-1
  TF_STATE_KEY: task-management/dev/terraform.tfstate

  TF_VAR_aws_account_id: "731629701372"
  TF_VAR_aws_region: eu-west-1
  TF_VAR_environment: dev
  TF_VAR_project_name: task-management
  TF_VAR_vpc_cidr: "10.20.0.0/16"
  TF_VAR_frontend_image_tag: bootstrap
  TF_VAR_backend_image_tag: bootstrap
  TF_VAR_hosted_zone_name: hashim-next-gen.com
  TF_VAR_application_subdomain: tasks

jobs:
  deploy:
    name: Plan and apply development infrastructure
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialize Terraform
        run: |
          terraform -chdir=infra/terraform/environments/dev init \
            -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
           bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config=" -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        run: terraform -chdir=infra/terraform/environments/dev validate

      - name: Create Terraform plan
        run: |
          terraform -chdir=infra/terraform/environments/dev plan \
            -lock-timeout=5m \
            -out=tfplan

      - name: Apply Terraform plan
        run: |
          terraform -chdir=infra/terraform/environments/dev apply \
            -lock-timeout=5m \
            tfplan